[workspace]
resolver = "3"
members = [
    # Shared layers. `harness` never depends on a construction (POLICY §5).
    "harness",
    "reference",

    # Constructions. Wrapped ones (POLICY §1) carry no columns/air/generation.
    "poseidon2",
    "poseidon1",
    "monolith",
    "rescue-prime",
    "neptune",
    "anemoi",
    "griffin",
    "tip5",
    "xhash",
    "psquarehash",
    "gmimc",
    "gmimc2",

    # Not a construction (POLICY §1) and not on the grid (POLICY §3): the
    # traditional hashes the introduction table compares against.
    "traditional",

    # The only crate that knows which hashes exist.
    "bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# ---------------------------------------------------------------------------
# Plonky3: ONE pinned revision for every p3-* crate (POLICY §5, §11).
#
# f5b7977 is `main` as of 2026-08-13. It is the first revision that carries all
# four things this repository needs upstream:
#   * `p3-poseidon1-air`, `p3-poseidon2-air`, `p3-monolith-air` — the three
#     wrapped AIRs of POLICY §1;
#   * `p3-security` — `StarkSecurityParams::from_air(..).security_bits()`, the
#     fixed-security rule of POLICY §7;
#   * `p3-air::symbolic::{AirLayout, get_max_constraint_degree,
#     get_symbolic_constraints}` — the pinned cost columns of POLICY §11;
#   * `p3-lookup` + `p3-batch-stark` — the deferred LogUp path of POLICY §12.
#
# Changing this revision moves every measured number: it is pinned with them
# (POLICY §11) and updating it is a deliberate, reported change.
# ---------------------------------------------------------------------------
p3-air = { git = "https://github.com/Plonky3/Plonky3.git", rev = "f5b7977e5c89adc8375b5c63a5a5092985b1f603" }
p3-blake3-air = { git = "https://github.com/Plonky3/Plonky3.git", rev = "f5b7977e5c89adc8375b5c63a5a5092985b1f603" }
