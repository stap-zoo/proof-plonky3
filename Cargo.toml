# Third party. Versions follow Plonky3's own workspace so the lockfile unifies.
blake3 = { version = "1.8", default-features = false }
clap = { version = "4.6.1", features = ["derive"] }
postcard = { version = "1.1.3", default-features = false }
rand = { version = "0.10.1" }
rand_xoshiro = "0.8.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
sha2 = { version = "0.11.0", default-features = false }
sha3 = "0.10"
tracing = "0.1.44"
tracing-forest = "0.3.1"
tracing-subscriber = { version = "0.3.23", features = ["std", "env-filter"] }

# Local crates.
harness = { path = "harness" }
reference = { path = "reference" }

anemoi = { path = "anemoi" }
gmimc = { path = "gmimc" }
gmimc2 = { path = "gmimc2" }
griffin = { path = "griffin" }
monolith = { path = "monolith" }
neptune = { path = "neptune" }
poseidon1 = { path = "poseidon1" }
poseidon2 = { path = "poseidon2" }
psquarehash = { path = "psquarehash" }
rescue-prime = { path = "rescue-prime" }
tip5 = { path = "tip5" }
traditional = { path = "traditional" }
xhash = { path = "xhash" }

# ---------------------------------------------------------------------------
# Measurements are release-only (POLICY §10, §11): `prove` runs
# `check_constraints` itself under `debug_assertions`, so a debug number is a
# number for a different program.
# ---------------------------------------------------------------------------
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

# `cargo test` should still be fast enough to run the KATs and the negative
# tests, while keeping `debug_assertions` on — that is what catches layout
# mistakes early (POLICY §10).
[profile.test]
opt-level = 2
