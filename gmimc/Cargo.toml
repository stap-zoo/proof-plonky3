[package]
name = "gmimc"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "GMiMC-erf: native permutation and AIR, both written here."

[dependencies]
harness.workspace = true
# `_init_cons` for every instance: `../ref`'s `gmimc/instances.py` pins the
# BN254 and BLS12-381 `t=3` pair only, so all four small-prime grid points are
# generated at the exporter call site and derive their constants (POLICY §3).
reference.workspace = true

p3-air.workspace = true
p3-field.workspace = true
p3-matrix.workspace = true
p3-uni-stark.workspace = true

# The seeded-input trace generator of POLICY §7: the harness owns the seed, the
# construction owns turning it into inputs.
rand.workspace = true
rand_xoshiro.workspace = true
tracing.workspace = true

[dev-dependencies]
p3-baby-bear.workspace = true
p3-goldilocks.workspace = true
p3-koala-bear.workspace = true
p3-mersenne-31.workspace = true

[lints]
workspace = true
